<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinturest - Catalogo de Productos</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
</head>
<body>

    <header>
        <h1>🎨 Pinturest</h1>
        <p>Catalogo de Productos</p>
    </header>

    <main>
        <!-- AVISO TEMPORIZADO (setTimeout) -->
        <div id="aviso" class="aviso oculto"></div>

        <!-- FORMULARIO PARA AGREGAR PRODUCTOS -->
        <section class="formulario">
            <h2>Agregar Producto</h2>
            <div class="form-grupo">
                <input type="text" id="inputNombre" placeholder="Nombre del producto">
                <input type="number" id="inputPrecio" placeholder="Precio">
                <input type="number" id="inputStock" placeholder="Stock">
                <select id="inputCategoria">
                    <option value="">Selecciona una categoria</option>
                    <option value="Pinturas">Pinturas</option>
                    <option value="Pinceles">Pinceles</option>
                    <option value="Rodillos">Rodillos</option>
                    <option value="Otros">Otros</option>
                </select>
                <button id="btnAgregar">+ Agregar</button>
            </div>
            <p id="mensaje"></p>
        </section>

        <!-- BARRA DE BUSQUEDA -->
        <section class="busqueda">
            <input type="text" id="inputBuscar" placeholder="Buscar producto...">
        </section>

        <!-- ESTADO DE CARGA (promesa async/await) -->
        <p id="cargando" class="cargando oculto">⏳ Cargando productos...</p>

        <!-- CONTENEDOR DE PRODUCTOS -->
        <section id="contenedor-productos"></section>
    </main>

</body>
</html>
